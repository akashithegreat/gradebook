{% extends "base.html" %}
{% block title %}Add Grade for {{ student }}{% endblock %}
{% block content %}
  <h2>Add Grade for {{ student }}</h2>

  <form method="POST" class="mt-3">
    <label for="assignment">Assignment:</label>
    <select name="assignment" class="form-select mb-2">
      {% for a in assignments %}
        <option value="{{ a.name }}">{{ a.name }} ({{ a.weight }}%)</option>
      {% endfor %}
    </select>

    <label for="score">Score:</label>
    <input type="number" step="0.1" name="score" required class="form-control mb-3">

    <button type="submit" class="btn btn-success">Submit Grade</button>
    <a href="{{ url_for('teacher_home') }}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
{% endblock %}
